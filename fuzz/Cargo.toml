[package]
name = "ash-log-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"

[dependencies.ash-log]
path = ".."
features = ["hmac-chain"]

[[bin]]
name = "verify_chain"
path = "fuzz_targets/verify_chain.rs"
test = false
doc = false
bench = false

[[bin]]
name = "event_roundtrip"
path = "fuzz_targets/event_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filter_directives"
path = "fuzz_targets/filter_directives.rs"
test = false
doc = false
bench = false

[[bin]]
name = "severity_parse"
path = "fuzz_targets/severity_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "redaction"
path = "fuzz_targets/redaction.rs"
test = false
doc = false
bench = false
