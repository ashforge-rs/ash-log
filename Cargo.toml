[package]
name = "ash-log"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Security audit logging for the ash-rpc ecosystem"
license = "Apache-2.0"
repository = "https://github.com/ashforge-rs/ash-log"
documentation = "https://docs.rs/ash-log"
homepage = "https://github.com/ashforge-rs/ash-log"
keywords = ["audit", "logging", "security", "compliance", "json"]
categories = ["development-tools::debugging"]
authors = ["Giorgos Ntemiris <gntem@users.noreply.github.com>"]
readme = "README.md"
exclude = [
    "Makefile",
    ".gitignore",
    ".github/",
    ".commitlintrc.json",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
## Enables OCSF 1.8.0 event types, schema validation, and the `ocsf_codegen` binary.
ocsf = []
## Enables `HmacChainIntegrity` tamper-evident hash chaining and the `ash-log-verify` binary.
hmac-chain = ["dep:hmac", "dep:sha2"]
## Enables the `tracing` bridge, routing `tracing` events into a `Logger`.
tracing = ["dep:tracing", "dep:tracing-subscriber"]
## Enables Hybrid Logical Clock timestamps, giving events a monotonic causal
## ordering that survives wall-clock adjustment and spans services.
hlc = ["dep:ash-time"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["registry", "std"] }
ash-time = { version = "1.0", optional = true }

[[bin]]
name = "ocsf_codegen"
path = "src/bin/ocsf_codegen.rs"
required-features = ["ocsf"]

[[bin]]
name = "ash-log-verify"
path = "src/bin/verify.rs"
required-features = ["hmac-chain"]

[[example]]
name = "02_tamper_evident"
required-features = ["hmac-chain"]

[[example]]
name = "03_levels_and_filtering"
required-features = ["hmac-chain"]

[[example]]
name = "04_tracing_bridge"
required-features = ["tracing", "hmac-chain"]

[[example]]
name = "05_provenance"
required-features = ["hmac-chain"]

[[example]]
name = "06_service_end_to_end"
required-features = ["hmac-chain"]

[[example]]
name = "07_concurrent_logging"
required-features = ["hmac-chain"]

[[example]]
name = "08_macros"
required-features = ["hmac-chain"]

[[example]]
name = "10_production_setup"
required-features = ["hmac-chain"]

[[example]]
name = "09_causal_ordering"
required-features = ["hlc", "hmac-chain"]

[[bench]]
name = "logging"
harness = false
required-features = ["hmac-chain"]

[profile.bench]
debug = true
